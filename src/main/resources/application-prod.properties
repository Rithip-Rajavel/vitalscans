# Production Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/vitalscan_prod
spring.datasource.username=vitalscan_prod
spring.datasource.password=prod_secure_password_2024
spring.datasource.driver-class-name=org.postgresql.Driver

# Production JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production Logging
logging.level.com.vitalscan=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Production JWT Configuration (24 hours)
jwt.expiration=86400000

# Production Security Headers
security.headers.frame-options=DENY
security.headers.content-type-options=nosniff
security.headers.xss-protection=1; mode=block
