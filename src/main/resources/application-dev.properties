# Development Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/vitalscan_dev
spring.datasource.username=umar
spring.datasource.password=Password@123
spring.datasource.driver-class-name=org.postgresql.Driver

# Development JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development Logging
logging.level.com.vitalscan=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Development JWT Configuration (shorter expiration for testing)
jwt.expiration=3600000
